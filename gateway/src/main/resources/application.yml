spring:
  application:
    name: gateway

server:
  port: 8080

# Every setting can be overridden with an environment variable,
# e.g. RATELIMIT_MODE=memory or BACKEND_URL=http://backend:8081.
ratelimit:
  mode: redis                  # redis (shared, in-memory fallback) | memory (per gateway)
  capacity: 5                  # burst of 5 requests...
  refill-tokens: 1             # ...then 1 more...
  refill-period: 2s            # ...every 2 seconds
  trust-forwarded-for: false   # only true behind a proxy that overwrites X-Forwarded-For (nginx)
  redis:
    url: redis://localhost:6379
    timeout: 100ms
    reconnect-interval: 2s

backend:
  url: http://localhost:8081
  connect-timeout: 1s
  read-timeout: 5s

demo:
  show-instance: false         # adds X-Served-By; demo only
  instance-id: gateway

management:
  endpoints:
    web:
      exposure:
        include: health
