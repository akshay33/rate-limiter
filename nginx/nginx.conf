# Load balancer in front of the gateways. The only service reachable from outside.

upstream gateways {
    # Round-robin: each request goes to the next gateway in turn.
    # The shared zone makes all nginx worker processes use one rotation; without it,
    # each worker rotates separately and new connections mostly land on gw1.
    zone gateways 64k;
    server gw1:8080;
    server gw2:8080;
    server gw3:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://gateways;
        proxy_set_header Host $host;
        # Overwrite (not append) with the address nginx actually saw, so clients
        # can't forge their IP to get a fresh rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
